<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LED Hex Floor Simulator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      user-select: none;
    }

    header {
      width: 100%;
      max-width: 1400px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 16px;
      border-bottom: 1px solid #1e1e2e;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-hex {
      width: 32px; height: 32px;
      background: #6c3ef5;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      animation: pulse-hex 2s ease-in-out infinite;
    }

    @keyframes pulse-hex {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; background: #ff6b35; }
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #c8b4fa;
    }

    .stats {
      display: flex;
      gap: 20px;
      font-size: 0.78rem;
      color: #888;
    }

    .stat-item { display: flex; flex-direction: column; align-items: center; }
    .stat-value { font-size: 1rem; font-weight: 700; color: #c8b4fa; }
    .stat-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; }

    #conn-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem; padding: 4px 10px;
      border-radius: 20px; border: 1px solid #333;
      background: #111;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
    .dot.connected { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
    .dot.disconnected { background: #f44336; }
    .dot.connecting { background: #ff9800; animation: blink 0.8s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.2; } }

    .canvas-wrapper {
      position: relative;
      overflow: auto;
      max-width: 100%;
      background: #06060c;
      border: 1px solid #1a1a2e;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 0 60px rgba(108, 62, 245, 0.08);
    }

    canvas {
      display: block;
      cursor: pointer;
      border-radius: 4px;
    }

    .controls {
      width: 100%;
      max-width: 1400px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button {
      background: #1a1a2e;
      color: #c8b4fa;
      border: 1px solid #3a2e6a;
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: #2a2050; border-color: #6c3ef5; }
    button.active { background: #6c3ef5; color: #fff; border-color: #6c3ef5; }

    label {
      font-size: 0.78rem;
      color: #888;
      display: flex; align-items: center; gap: 6px;
    }

    input[type=range] {
      accent-color: #6c3ef5;
      width: 80px;
    }

    #log {
      width: 100%;
      max-width: 1400px;
      background: #06060c;
      border: 1px solid #1a1a2e;
      border-radius: 8px;
      padding: 8px 12px;
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      color: #555;
      height: 56px;
      overflow-y: auto;
      margin-top: 10px;
    }

    #log .entry { color: #777; }
    #log .entry.press { color: #6c3ef5; }
    #log .entry.frame { color: #2e7d32; }
    #log .entry.error { color: #f44336; }

    .tooltip {
      position: absolute;
      background: rgba(0,0,0,0.85);
      color: #c8b4fa;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      pointer-events: none;
      display: none;
      z-index: 10;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-hex"></div>
    <h1>LED Hex Floor Simulator</h1>
  </div>

  <div class="stats">
    <div class="stat-item">
      <span class="stat-value" id="stat-fps">0</span>
      <span class="stat-label">FPS</span>
    </div>
    <div class="stat-item">
      <span class="stat-value" id="stat-grid">—</span>
      <span class="stat-label">Grid</span>
    </div>
    <div class="stat-item">
      <span class="stat-value" id="stat-active">0</span>
      <span class="stat-label">Active tiles</span>
    </div>
    <div class="stat-item">
      <span class="stat-value" id="stat-pressed">0</span>
      <span class="stat-label">Pressed</span>
    </div>
  </div>

  <div id="conn-badge">
    <div class="dot connecting" id="dot"></div>
    <span id="conn-label">Connecting…</span>
  </div>
</header>

<div class="canvas-wrapper">
  <canvas id="hexCanvas"></canvas>
  <div class="tooltip" id="tooltip"></div>
</div>

<div class="controls">
  <button id="btn-hold" onclick="toggleHold()">Hold mode: OFF</button>
  <label>
    Hex size:
    <input type="range" id="sizeSlider" min="14" max="48" value="28" oninput="onSizeChange(this.value)">
    <span id="sizeLabel">28</span>px
  </label>
  <label>
    Glow:
    <input type="range" id="glowSlider" min="0" max="30" value="10" oninput="onGlowChange(this.value)">
  </label>
  <button onclick="sendTestPattern()">Test pattern</button>
  <button onclick="clearPressed()">Clear pressed</button>
  <button onclick="toggleGrid()">Toggle grid lines</button>
</div>

<div id="log"></div>

<script>
// ── Configuration ──────────────────────────────────────────────────────
const WS_URL = `ws://${location.host}/ws`;

// Grid state (filled when first frame arrives)
let ROWS = 16, COLS = 26;
let HEX_SIZE = 28;        // centre-to-vertex radius
let GLOW_AMOUNT = 10;
let showGrid = true;
let holdMode = false;     // if true, press stays until second click

// Derived hex geometry (pointy-top orientation)
function hexMetrics(size) {
  const w = Math.sqrt(3) * size;   // flat-to-flat width
  const h = 2 * size;              // point-to-point height
  const dx = w;                    // col step
  const dy = h * 0.75;             // row step
  return { w, h, dx, dy };
}

// ── State ──────────────────────────────────────────────────────────────
let grid = [];         // [row][col] = [r,g,b]
let pressed = new Set(); // "r,c" strings currently held pressed
let pressedCount = 0;

// ── Canvas setup ──────────────────────────────────────────────────────
const canvas = document.getElementById('hexCanvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

function resizeCanvas() {
  const m = hexMetrics(HEX_SIZE);
  const W = Math.ceil(COLS * m.dx + m.w * 0.5) + 20;
  const H = Math.ceil(ROWS * m.dy + m.h * 0.25) + 20;
  canvas.width = W;
  canvas.height = H;
}

// Pointy-top hex: centre (cx, cy), size r
function hexPath(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 180 * (60 * i - 30);
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function hexCentre(row, col) {
  const m = hexMetrics(HEX_SIZE);
  const offX = (row % 2 === 1) ? m.dx * 0.5 : 0;
  const cx = 10 + col * m.dx + offX + m.w * 0.5;
  const cy = 10 + row * m.dy + m.h * 0.5;
  return { cx, cy };
}

function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => Math.min(255, v).toString(16).padStart(2, '0')).join('');
}

function colorBrightness(r, g, b) {
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

let activeTiles = 0;

// Normalise a cell from the server into 3 [R,G,B] rings.
// Server sends [[R0,G0,B0],[R1,G1,B1],[R2,G2,B2]] but handle flat [R,G,B] too.
function cellToRings(cell) {
  if (!cell) return [[0,0,0],[0,0,0],[0,0,0]];
  if (Array.isArray(cell[0])) return cell;          // already 3-ring
  return [cell, cell, cell];                         // flat — same on all rings
}

function drawFrame() {
  if (!grid.length) return;
  const m = hexMetrics(HEX_SIZE);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  activeTiles = 0;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const row  = grid[r] || [];
      const rings = cellToRings(row[c]);   // [[R,G,B],[R,G,B],[R,G,B]]
      const key  = `${r},${c}`;
      const isPressed = pressed.has(key);

      // Outermost ring drives glow / active-tile count
      const [ri, gi, bi] = rings[0];
      const bright = colorBrightness(ri, gi, bi);
      const anyOn  = rings.some(([rr,gg,bb]) => rr + gg + bb > 2);
      if (anyOn) activeTiles++;

      const { cx, cy } = hexCentre(r, c);
      const outerR = HEX_SIZE - 1.5;

      // Glow behind the tile (outermost ring color)
      if (bright > 10 && GLOW_AMOUNT > 0) {
        const glow = ctx.createRadialGradient(cx, cy, outerR * 0.2, cx, cy, outerR * 1.4);
        const alpha = Math.min(0.6, bright / 255 * 0.8);
        glow.addColorStop(0, `rgba(${ri},${gi},${bi},${alpha})`);
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        hexPath(cx, cy, outerR * 1.3);
        ctx.fillStyle = glow;
        ctx.fill();
        ctx.restore();
      }

      // ── 3 concentric rings (outer → middle → inner) ───────────────────
      // Draw largest first; each subsequent hex is drawn on top, creating
      // visible ring bands.  Proportions approximate the physical tile.
      const ringSizes = [outerR, outerR * 0.64, outerR * 0.36];
      for (let k = 0; k < 3; k++) {
        const [rk, gk, bk] = rings[k];
        hexPath(cx, cy, ringSizes[k]);
        ctx.fillStyle = (rk + gk + bk < 3) ? '#0d0d18' : rgbToHex(rk, gk, bk);
        ctx.fill();
      }

      // Grid outline on the outermost ring
      if (showGrid) {
        hexPath(cx, cy, outerR);
        ctx.strokeStyle = anyOn ? 'rgba(255,255,255,0.08)' : '#1e1e35';
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }

      // Pressed overlay
      if (isPressed) {
        hexPath(cx, cy, outerR);
        ctx.fillStyle = 'rgba(255,255,255,0.30)';
        ctx.fill();
        hexPath(cx, cy, outerR);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // Row/col label (only at large sizes)
      if (HEX_SIZE >= 32) {
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.font = `${Math.max(8, HEX_SIZE * 0.28)}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${r},${c}`, cx, cy);
      }
    }
  }

  document.getElementById('stat-active').textContent = activeTiles;
  document.getElementById('stat-pressed').textContent = pressedCount;
}

// ── WebSocket ──────────────────────────────────────────────────────────
let ws;
let reconnectTimer;

function connect() {
  clearTimeout(reconnectTimer);
  setStatus('connecting');
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    setStatus('connected');
    logEntry('Connected to simulator server', 'frame');
  };

  ws.onmessage = ({ data }) => {
    try {
      const msg = JSON.parse(data);
      if (msg.type === 'frame') {
        ROWS = msg.rows;
        COLS = msg.cols;
        grid = msg.grid;
        document.getElementById('stat-fps').textContent = msg.fps;
        document.getElementById('stat-grid').textContent = `${ROWS}×${COLS}`;
        resizeCanvas();
        drawFrame();
      }
    } catch (e) {}
  };

  ws.onerror = () => setStatus('disconnected');
  ws.onclose = () => {
    setStatus('disconnected');
    logEntry('Disconnected — retrying in 2s…', 'error');
    reconnectTimer = setTimeout(connect, 2000);
  };
}

function sendMsg(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

// ── Tile interaction ───────────────────────────────────────────────────
function pixelToHex(px, py) {
  let best = null, bestDist = Infinity;
  const m = hexMetrics(HEX_SIZE);
  // Estimate search region
  const rMin = Math.max(0, Math.floor((py - 10 - m.h) / m.dy));
  const rMax = Math.min(ROWS - 1, Math.ceil((py - 10 + m.h) / m.dy));
  for (let r = rMin; r <= rMax; r++) {
    for (let c = 0; c < COLS; c++) {
      const { cx, cy } = hexCentre(r, c);
      const d = (px - cx) ** 2 + (py - cy) ** 2;
      if (d < bestDist) { bestDist = d; best = [r, c]; }
    }
  }
  // Reject if too far (outside the hex)
  if (bestDist > (HEX_SIZE * HEX_SIZE)) return null;
  return best;
}

canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const hit = pixelToHex(e.clientX - rect.left, e.clientY - rect.top);
  if (!hit) return;
  const [r, c] = hit;
  const key = `${r},${c}`;

  if (holdMode) {
    if (pressed.has(key)) {
      pressed.delete(key);
      pressedCount--;
      sendMsg({ type: 'release', row: r, col: c });
      logEntry(`Released [${r},${c}]`, 'press');
    } else {
      pressed.add(key);
      pressedCount++;
      sendMsg({ type: 'press', row: r, col: c });
      logEntry(`Pressed  [${r},${c}]`, 'press');
    }
    drawFrame();
  } else {
    pressed.add(key);
    pressedCount++;
    sendMsg({ type: 'press', row: r, col: c });
    logEntry(`Pressed  [${r},${c}]`, 'press');
    drawFrame();
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (holdMode) return;
  const rect = canvas.getBoundingClientRect();
  const hit = pixelToHex(e.clientX - rect.left, e.clientY - rect.top);
  if (!hit) return;
  const [r, c] = hit;
  const key = `${r},${c}`;
  if (pressed.has(key)) {
    pressed.delete(key);
    pressedCount--;
    sendMsg({ type: 'release', row: r, col: c });
    drawFrame();
  }
});

// Tooltip on hover
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const hit = pixelToHex(e.clientX - rect.left, e.clientY - rect.top);
  if (hit) {
    const [r, c] = hit;
    const rings = cellToRings((grid[r] || [])[c]);
    tooltip.textContent = `[${r},${c}]  outer:rgb(${rings[0].join(',')})  mid:rgb(${rings[1].join(',')})  inner:rgb(${rings[2].join(',')})`;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
    tooltip.style.top  = (e.clientY - rect.top  - 24) + 'px';
  } else {
    tooltip.style.display = 'none';
  }
});
canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

// ── Controls ───────────────────────────────────────────────────────────
function toggleHold() {
  holdMode = !holdMode;
  const btn = document.getElementById('btn-hold');
  btn.textContent = `Hold mode: ${holdMode ? 'ON' : 'OFF'}`;
  btn.classList.toggle('active', holdMode);
}

function onSizeChange(v) {
  HEX_SIZE = parseInt(v);
  document.getElementById('sizeLabel').textContent = v;
  resizeCanvas();
  drawFrame();
}

function onGlowChange(v) {
  GLOW_AMOUNT = parseInt(v);
  drawFrame();
}

function toggleGrid() {
  showGrid = !showGrid;
  drawFrame();
}

function clearPressed() {
  pressed.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    sendMsg({ type: 'release', row: r, col: c });
  });
  pressed.clear();
  pressedCount = 0;
  drawFrame();
}

function sendTestPattern() {
  logEntry('Test pattern requested (game must support it)', 'frame');
  // Press tiles in a wave pattern for visual testing
  let delay = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      setTimeout(() => {
        sendMsg({ type: 'press', row: r, col: c });
        setTimeout(() => sendMsg({ type: 'release', row: r, col: c }), 200);
      }, delay);
      delay += 30;
    }
  }
}

// ── Status / logging ───────────────────────────────────────────────────
function setStatus(s) {
  const dot = document.getElementById('dot');
  const label = document.getElementById('conn-label');
  dot.className = 'dot ' + s;
  label.textContent = s.charAt(0).toUpperCase() + s.slice(1);
}

const logEl = document.getElementById('log');
let logEntryCount = 0;
function logEntry(msg, cls = 'entry') {
  const d = document.createElement('div');
  d.className = `entry ${cls}`;
  d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.prepend(d);
  logEntryCount++;
  if (logEntryCount > 40) logEl.lastChild?.remove();
}

// ── Boot ───────────────────────────────────────────────────────────────
resizeCanvas();
connect();
</script>
</body>
</html>
